[versions]
agp = "9.1.1"
kotlin = "2.4.10"
compose = "1.11.1"
coroutines = "1.10.2"
junit = "4.13.2"

[libraries]
compose-backhandler = { module = "org.jetbrains.compose.ui:ui-backhandler", version.ref = "compose" }
backdrop = { module = "io.github.kyant0:backdrop", version = "2.0.0-alpha02" }
miuix = { module = "top.yukonga.miuix.kmp:miuix", version = "0.8.5" }
coui = { module = "io.github.suqi8.coui.kmp:coui-ui", version = "1.1.0" }
cupertino = { module = "io.github.schott12521:cupertino", version = "2.3.1" }
activity-compose = { module = "androidx.activity:activity-compose", version = "1.12.4" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
shizuku-api = { module = "dev.rikka.shizuku:api", version = "13.1.5" }
shizuku-provider = { module = "dev.rikka.shizuku:provider", version = "13.1.5" }
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version = "2.1.5" }
androidx-test-runner = { module = "androidx.test:runner", version = "1.7.0" }
androidx-test-junit = { module = "androidx.test.ext:junit", version = "1.3.0" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
junit = { module = "junit:junit", version.ref = "junit" }
zxing-core = { module = "com.google.zxing:core", version = "3.5.3" }

[plugins]
compose = { id = "org.jetbrains.compose", version.ref = "compose" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
